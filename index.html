function toMono8k(ab){const d=ab.getChannelData(0),q=ab.sampleRate/FS,N=Math.min(Math.floor(d.length/q),FS*4),o=new Float32Array(N);let mx=1e-6;
 for(let i=0;i<N;i++){const p=i*q,j=Math.floor(p),f=p-j;o[i]=d[j]*(1-f)+(d[j+1]||0)*f;mx=Math.max(mx,Math.abs(o[i]))}
 for(let i=0;i<N;i++)o[i]*=.8/mx;return o}

 for(let n=0;n<N;n++){const t=n/FS,f0=120+18*Math.sin(2*Math.PI*.7*t);ph+=2*Math.PI*f0/FS;const env=Math.max(0,Math.sin(2*Math.PI*1.6*t))**.6;let v=0;
  for(let k=1;k<=14;k++){const f=k*f0;v+=Math.sin(k*ph)/k*(1+2*Math.exp(-(((f-650)/250)**2))+1.2*Math.exp(-(((f-1800)/400)**2)))}o[n]=v*env}
 let mx=0;for(const v of o)mx=Math.max(mx,Math.abs(v));for(let i=0;i<N;i++)o[i]*=.8/mx;speech=o;src='demo';toast('ready')};

/* ---- simulation and algorithms ---- */
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const gauss=r=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(2*Math.PI*r());
const pw=a=>{let s=0;for(const v of a)s+=v*v;return s/a.length+1e-12};
function makeH(M,type,r,g){const h=new Float32Array(M);let e=0;
 for(let i=0;i<M;i++){h[i]=type==='sparse'?(i<16?gauss(r)*Math.exp(-i/5):0):gauss(r)*Math.exp(-4*i/M);e+=h[i]*h[i]}
 const k=g/Math.sqrt(e);for(let i=0;i<M;i++)h[i]*=k;return h}
function conv(x,h){const N=x.length,M=h.length,y=new Float32Array(N);
 for(let n=0;n<N;n++){let a=0;const k=Math.min(M,n+1);for(let i=0;i<k;i++)if(h[i])a+=h[i]*x[n-i];y[n]=a}return y}
let MIX={white:50,wind:30};
function makeNoise(N,type,r){if(type==='mix'){const o=new Float32Array(N);if(!Object.values(MIX).some(v=>v>0))MIX.white=50;for(const k in MIX){if(MIX[k]>0){const x=makeNoise(N,k,r),p=Math.sqrt(pw(x));for(let i=0;i<N;i++)o[i]+=MIX[k]/100*x[i]/p}}return o}const b=new Float32Array(N);let p1=0,p2=0,p3=0,lp=0,env=1,envT=1;
 for(let n=0;n<N;n++){const w=gauss(r),t=2*Math.PI*n/FS;let v=w;
  if(type==='usasi'){p1=.85*p1+.15*w;p2=.85*p2+.15*p1;v=p2*4}
  else if(type==='pink'){p1=.99765*p1+w*.099046;p2=.963*p2+w*.2965164;p3=.57*p3+w*1.0526913;v=p1+p2+p3+w*.1848}
  else if(type==='car'){lp=.97*lp+.03*w;v=lp*6+.6*Math.sin(60*t)+.4*Math.sin(120*t)}
  else if(type==='wind'){lp=.98*lp+.02*w;v=lp*7*(.6+.4*Math.sin(.4*t+1.3*Math.sin(.05*t)))+w*.05}
  else if(type==='babble'){if(n%400===0)envT=.2+r()*1.6;env+=.01*(envT-env);p1=.85*p1+.15*w;p2=.85*p2+.15*p1;v=p2*4*env}
  else if(type==='hum'){v=Math.sin(50*t)+.5*Math.sin(100*t)+.3*Math.sin(150*t)+.1*w}
  else if(type==='impulse'){v=r()<.003?w*12:w*.05}
  b[n]=v}return b}
function makeVad(s){const L=160,v=new Uint8Array(s.length),E=[];
 for(let i=0;i<s.length;i+=L){let e=0;for(let j=i;j<Math.min(i+L,s.length);j++)e+=s[j]*s[j];E.push(e)}
 const thr=.1*E.reduce((a,b)=>a+b,0)/E.length;E.forEach((e,k)=>{if(e>thr)v.fill(1,k*L,Math.min((k+1)*L,s.length))});return v}
/* only the algorithms of the thesis. f: Forward structure (reference = mic 2) else clean noise reference; n: normalized; p: proportionate; v: variable step; d: voice activity detector */
const ALG={LMS:{},NLMS:{n:1},PNLMS:{n:1,p:1},FNLMS:{f:1,n:1},VFNLMS:{f:1,n:1,v:1},VFPNLMS:{f:1,n:1,p:1,v:1,d:1}},KEYS=Object.keys(ALG);
const P={mu:.2,mumin:.05,mumax:1,alpha:.9,gamma:.3,beta:0};
function run(key,c){const a=ALG[key],{m1,s1,n1,vad}=c,X=a.f?c.m2:c.n2,XS=a.f?c.s2:c.z,XN=c.n2,N=m1.length,M=c.M,w=new Float32Array(M),g=new Float32Array(M);
 const out=new Float32Array(N),oS=new Float32Array(N),oN=new Float32Array(N),sx=pw(X);let lam=P.mumin,eP=0,pe=1e-4,xx=0;
 for(let n=0;n<N;n++){const k=Math.min(M,n+1);let y=0,ys=0,yn=0;
  for(let i=0;i<k;i++){const j=n-i;y+=w[i]*X[j];ys+=w[i]*XS[j];yn+=w[i]*XN[j]}
  const e=m1[n]-y;out[n]=e;oS[n]=s1[n]-ys;oN[n]=n1[n]-yn;
  xx+=X[n]*X[n];if(n>=M)xx-=X[n-M]*X[n-M];xx=Math.max(xx,0);
  let mu=P.mu;
  if(a.v){pe=.99*pe+.01*e*e;lam=P.alpha*lam+P.gamma*e*eP/(pe+1e-9);mu=Math.min(P.mumax,Math.max(P.mumin,lam));if(a.d&&vad[n])mu=P.mumin}
  eP=e;
  if(a.p){let l1=0;for(let i=0;i<M;i++)l1+=Math.abs(w[i]);const q=(1-P.beta)/(2*M),b=(1+P.beta)/(2*l1+1e-6);let den=1e-4;
   for(let i=0;i<k;i++){g[i]=q+b*Math.abs(w[i]);const x=X[n-i];den+=g[i]*x*x}
   const f=mu*e/den;for(let i=0;i<k;i++)w[i]+=f*g[i]*X[n-i]}
  else{const f=a.n?mu*e/(xx+1e-4):mu*e/(M*sx);for(let i=0;i<k;i++)w[i]+=f*X[n-i]}}
 return {out,snr:10*Math.log10(pw(oS)/pw(oN))}}
function simulate(list){const N=speech.length,r=rng(7),M=+$('M').value,rsb=+$('rsb').value;
 const h12=makeH(M,$('room').value,r,.3),h21=makeH(M,$('room').value,r,1);
 let b=makeNoise(N,nz,r);const s1=speech,s2=conv(s1,h12);let n1=conv(b,h21);
 const k=Math.sqrt(pw(s1)/(pw(n1)*Math.pow(10,rsb/10)));b=b.map(v=>v*k);n1=n1.map(v=>v*k);
 const m1=new Float32Array(N),m2=new Float32Array(N);for(let i=0;i<N;i++){m1[i]=s1[i]+n1[i];m2[i]=b[i]+s2[i]}
 const c={m1,m2,s1,s2,n1,n2:b,z:new Float32Array(N),vad:makeVad(s1),M},o={rsb,noisy:m1,alg:{}};
 list.forEach(q=>o.alg[q]=run(q,c));
 let mx=0;for(const v of m1)mx=Math.max(mx,Math.abs(v));for(const q of list)for(const v of o.alg[q].out)mx=Math.max(mx,Math.abs(v));o.scale=.85/mx;
 o.best=list.reduce((a,q)=>o.alg[q].snr>o.alg[a].snr?q:a);return o}
